<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>AI Usage Monitor tray spike</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        height: 420px;
        margin: 0;
        padding: 24px;
        overflow: hidden;
        border: 1px solid #374151;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: #9ca3af;
        line-height: 1.45;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }
      dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        margin-top: 28px;
      }
      dt {
        color: #9ca3af;
      }
      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      #status {
        margin-top: 24px;
        color: #86efac;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tray acceptance spike</h1>
      <p>
        This static panel tests focused opening, interactive controls, native
        blur dismissal, and hidden background work.
      </p>
      <button id="interaction" type="button">
        Record interaction (<span id="clicks">0</span>)
      </button>
      <dl>
        <dt>Background ticks</dt>
        <dd id="ticks">0</dd>
        <dt>Refresh commands</dt>
        <dd id="refreshes">0</dd>
      </dl>
      <div id="status" role="status" aria-live="polite">Ready</div>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
